name: Testing branch

# `npm run push:testing` copies the shipping files (+ tests/) from `development`
# to the `testing` branch and pushes. Every push here runs the full gate set.
# Green → `npm run release` tags this exact tree.
#
# The weekly run re-tests the last pushed `testing` tree against whatever
# WordPress wp-env installs today, so a WordPress release that breaks the plugin
# shows up before users report it. GitHub only fires schedules from the default
# branch, so this file must exist there.

on:
  push:
    branches: [testing]
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true   # a newer push supersedes the older run

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      slug: stepped-content
      main_file: index.php
      ref: ${{ github.event_name == 'schedule' && 'testing' || '' }}
      plugin_check_blocking: true
    secrets: inherit

  result:
    name: Result
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$RESULT" = "success" ]; then
            if [ "$EVENT" = "schedule" ]; then
              echo "✅ Weekly run: the last tested \`testing\` tree still passes on today's WordPress." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "✅ testing @ ${GITHUB_SHA::7} passed every check. Run \`npm run release\` from development to tag it." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "❌ Checks: $RESULT — fix on development, then \`npm run push:testing\` again." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
